name: Web V2 isolated SourceHub contract tests
on:
  push:
    branches: [feature/web-v2-migration-20261027]
    paths:
      - "src/lib/sourcehub/**"
      - "tests/sourcehub.core.test.mjs"
      - "tests/sourcehub.open-films.test.mjs"
      - "tests/sourcehub.routes.test.mjs"
      - "src/app/api/v2/sourcehub/**"
      - "src/lib/webv2/player/**"
      - "tests/webv2.playback.test.mjs"
      - ".github/workflows/web-v2-migration-ci.yml"
      - "next.config.js"
      - "src/app/v2/**"
      - "src/components/webv2/**"
      - "tests/webv2.ui.test.mjs"
      - "tests/webv2.source-lab.test.mjs"
      - "tests/webv2.source-config.test.mjs"
      - "tests/webv2.remote-config.test.mjs"
      - "src/lib/webv2/source-config-lab.ts"
      - "tests/webv2.preview-guard.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Assert independent SourceHub excludes old host and executable scripts
        shell: bash
        run: |
          if grep -R -nE 'wpujoyflix\.vercel\.app|TV_PERSONAL_BACKEND_ORIGIN|child_process|eval\(' src/lib/sourcehub; then
            echo "Legacy dependency or arbitrary script execution found"
            exit 1
          fi
      - name: Run Node24 TypeScript contract tests without installing dependencies
        run: node --experimental-strip-types --test tests/sourcehub.core.test.mjs tests/sourcehub.open-films.test.mjs tests/sourcehub.routes.test.mjs tests/webv2.playback.test.mjs tests/webv2.preview-guard.test.mjs tests/webv2.ui.test.mjs tests/webv2.source-lab.test.mjs tests/webv2.source-config.test.mjs tests/webv2.remote-config.test.mjs

  legacy-build-audit:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Install pinned pnpm without arbitrary dependency lifecycle scripts
        run: |
          npm install --global pnpm@10.14.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify preview-only migration build guard in actual Next config
        shell: bash
        run: |
          set -euo pipefail
          if VERCEL=1 VERCEL_PROJECT_ID=prj_EUzmQpHGHpDZy6VDHZ2ao8LInC10 \
            VERCEL_ENV=preview VERCEL_TARGET_ENV=preview \
            VERCEL_GIT_COMMIT_REF=feature/web-v2-migration-20261027 \
            node -e 'require("./next.config.js")' > /tmp/web-v2-guard-denied 2>&1; then
            echo "FAIL: old production-linked project allowed migration build"
            exit 1
          fi
          grep -q WEB_V2_PREVIEW_ONLY_BUILD_BLOCKED /tmp/web-v2-guard-denied
          if VERCEL=1 VERCEL_PROJECT_ID=prj_Rsb44MGU9x6aEd6IqgR4A4MawFrX \
            VERCEL_ENV=production VERCEL_TARGET_ENV=production \
            VERCEL_GIT_COMMIT_REF=feature/web-v2-migration-20261027 \
            node -e 'require("./next.config.js")' > /tmp/web-v2-guard-denied 2>&1; then
            echo "FAIL: misclassified production target allowed"
            exit 1
          fi
          grep -q WEB_V2_PREVIEW_ONLY_BUILD_BLOCKED /tmp/web-v2-guard-denied
          VERCEL=1 VERCEL_PROJECT_ID=prj_Rsb44MGU9x6aEd6IqgR4A4MawFrX \
            VERCEL_ENV=preview VERCEL_TARGET_ENV=preview \
            VERCEL_GIT_COMMIT_REF=feature/web-v2-migration-20261027 \
            node -e 'require("./next.config.js")'
          echo "WEB_V2_PREVIEW_GUARD_CI_PASS"
      - name: Generate old-site read-only local app assets
        run: |
          node scripts/convert-config.js
          node scripts/generate-manifest.js
      - name: Compile isolated existing JoyFlix branch only; no deploy
        run: pnpm exec next build
      - name: Verify new SourceHub routes refuse unapproved sources on actual Next.js
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec next start --hostname 127.0.0.1 --port 3187 > /tmp/web-v2-sourcehub-smoke.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..50}; do
            if curl -fsS --max-time 2 http://127.0.0.1:3187/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "Legacy Next server not ready"
            tail -n 40 /tmp/web-v2-sourcehub-smoke.log
            exit 1
          fi
          code="$(curl --silent --show-error --max-time 7 --output /tmp/sourcehub-closed.json --write-out '%{http_code}' 'http://127.0.0.1:3187/api/v2/sourcehub/search?keyword=test')"
          test "$code" = "503"
          grep -q '"sourcehub_no_approved_sources"' /tmp/sourcehub-closed.json
          code="$(curl --silent --show-error --max-time 7 --output /tmp/sourcehub-invalid.json --write-out '%{http_code}' 'http://127.0.0.1:3187/api/v2/sourcehub/detail?source=bad!&id=1')"
          test "$code" = "400"
          curl -fsS --max-time 7 'http://127.0.0.1:3187/v2' | grep -q '观影指南 Web V2'
          curl -fsS --max-time 7 'http://127.0.0.1:3187/v2/watch?source=samplecms&id=42' | grep -q '影片播放页'
          echo "WEB_V2_ROUTE_SHELL_SMOKE_PASS"
          echo "WEB_V2_SOURCEHUB_ROUTE_FAIL_CLOSED_PASS"
      - name: HTTP smoke reviewed full open films on exact private Preview runtime
        shell: bash
        run: |
          set -euo pipefail
          VERCEL=1 VERCEL_ENV=preview VERCEL_TARGET_ENV=preview \
          VERCEL_PROJECT_ID=prj_Rsb44MGU9x6aEd6IqgR4A4MawFrX \
          VERCEL_GIT_COMMIT_REF=feature/web-v2-migration-20261027 \
            pnpm exec next start --hostname 127.0.0.1 --port 3188 > /tmp/web-v2-preview-run.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS --max-time 2 http://127.0.0.1:3188/v2 > /dev/null 2>&1; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then tail -n 35 /tmp/web-v2-preview-run.log; exit 1; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          const base="http://127.0.0.1:3188";
          const featured=await fetch(base+"/api/v2/sourcehub/featured");
          if(featured.status!==200)throw Error("featured not 200");
          const f=await featured.json();
          if(f.items?.length!==2)throw Error("not two real licensed open films");
          if(/mediaUrl|upload.wikimedia|token=/i.test(JSON.stringify(f)))throw Error("featured list leaked playback data");
          for(const item of f.items){
            const q=await fetch(base+"/api/v2/sourcehub/search?keyword="+encodeURIComponent(item.title.split("（")[0]));
            const sr=await q.json();
            if(q.status!==200 || sr.items.length<1)throw Error("search did not find full film");
            const url=base+"/api/v2/sourcehub/detail?source="+encodeURIComponent(item.sourceId)+"&id="+encodeURIComponent(item.workId);
            const res=await fetch(url);
            const d=await res.json();
            if(res.status!==200 || !d.item?.lines?.[0]?.episodes?.[0]?.mediaUrl?.endsWith(".webm") ||
              !d.item?.rights?.credit?.includes("Blender Foundation"))throw Error("rights-backed detail missing");
          }
          const missing=await fetch(base+"/api/v2/sourcehub/detail?source=blender-spring&id=bunny2008");
          if(missing.status!==404)throw Error("misbound cross-film ID not rejected");
          console.log("WEB_V2_TWO_REAL_OPEN_FILMS_HTTP_CHAIN_PASS");
          NODE

